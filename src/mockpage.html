<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Side Browser mock</title>
<style>
  body { font: 13px system-ui, sans-serif; margin: 12px; }
  #composer { width: 100%; height: 70px; box-sizing: border-box; }
  #files { display: none; }
  #log { white-space: pre-wrap; font-family: monospace; font-size: 11px; }
</style>
</head>
<body>
<h1>Mock chat</h1>
<textarea id="composer" placeholder="Type a message"></textarea>
<input id="files" type="file" accept=".pdf,.md,.txt,text/*,application/pdf" multiple hidden/>
<button id="send" type="button">Send</button>
<div id="log">idle</div>

<script>
/*
 * A minimal chat page for the self test. It records what arrived, so the test
 * can prove that a message, its context, and a PDF really reached the page.
 */
(function () {
  var received = [];
  window.__received = received;
  window.__context = "";

  var composer = document.getElementById("composer");

  // A page with no file input, like Gemini before its menu opens. The test uses
  // it to check that files arrive by paste.
  window.__pasted = [];
  if (/nofile=1/.test(location.search)) {
    var input = document.getElementById("files");
    if (input) {
      input.remove();
    }
  }
  // A page whose file input takes PDFs only, like Duck.ai.
  if (/pdfonly=1/.test(location.search)) {
    var only = document.getElementById("files");
    if (only) {
      only.setAttribute("accept", ".pdf,application/pdf");
    }
  }
  composer.addEventListener("paste", function (event) {
    var files = event.clipboardData ? Array.prototype.slice.call(event.clipboardData.files) : [];
    if (!files.length) {
      return;
    }
    event.preventDefault();
    files.forEach(function (file) {
      window.__pasted.push({ name: file.name, type: file.type, size: file.size });
    });
    note("pasted=" + window.__pasted.length);
  });
  var send = document.getElementById("send");
  var log = document.getElementById("log");

  function note(text) {
    log.textContent = text;
  }

  send.addEventListener("click", function () {
    var text = composer.value;
    if (!text || !text.trim()) {
      note("nothing to send");
      return;
    }
    received.push({
      text: text,
      files: Array.prototype.map.call(document.getElementById("files").files, function (file) {
        return { name: file.name, type: file.type, size: file.size };
      })
    });
    composer.value = "";
    document.getElementById("files").value = "";
    note("messages=" + received.length);
  });

  // The test asks for the held context through the actor, but it also checks
  // that the page itself never had to know about it.
  window.__setContext = function (value) {
    window.__context = value;
  };
})();
</script>
</body>
</html>
