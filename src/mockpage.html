<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Side Browser mock</title>
<style>
  body { font: 13px system-ui, sans-serif; margin: 12px; }
  #composer { width: 100%; height: 70px; box-sizing: border-box; }
  #log { white-space: pre-wrap; font-family: monospace; font-size: 11px; }
</style>
</head>
<body>
<h1>Mock chat</h1>
<textarea id="composer" placeholder="Type a message"></textarea>
<button id="attach" type="button">Attach</button>
<div id="input-slot"></div>
<button id="send" type="button">Send</button>
<div id="log">idle</div>

<script>
/*
 * A minimal chat page for the self test, built the way the real services work:
 *
 *   - the file input exists only after the attach button is clicked
 *   - a file is taken when the input reports a change, and the page owns it from
 *     then on, so clearing the input does not lose it
 *   - the send button takes whatever the page holds
 *
 * Query flags switch on the awkward cases:
 *   nofile=1    the input takes images only
 *   pdfonly=1   the input takes PDFs only
 */
(function () {
  var composer = document.getElementById("composer");
  var log = document.getElementById("log");
  var slot = document.getElementById("input-slot");
  var attached = [];

  function note(text) {
    log.textContent = text;
  }

  window.__received = [];
  window.__attached = attached;
  window.__dropped = [];
  // A real page keeps what it has already attached, and forgets it on leave.


  document.getElementById("attach").addEventListener("click", function () {
    if (slot.querySelector("input")) {
      note("input ready");
      return;
    }
    var element = document.createElement("input");
    element.id = "files";
    element.type = "file";
    element.multiple = true;
    element.hidden = true;
    element.setAttribute("accept", /images=1/.test(location.search)
      ? "image/png,image/jpeg,image/webp"
      : (/pdfonly=1/.test(location.search) ? ".pdf,application/pdf" : ""));
    element.addEventListener("change", function () {
      // The page copies the files out of its own input on every change.
      note("change with " + element.files.length + " file(s)");
      Array.prototype.map.call(element.files, function (file) {
        return { name: file.name, type: file.type, size: file.size };
      }).forEach(function (file) {
        attached.push(file);
      });
      note("attached=" + attached.length);
    });
    slot.appendChild(element);
    note("input ready");
  });

  document.addEventListener("dragover", function (event) {
    event.preventDefault();
  });
  document.addEventListener("drop", function (event) {
    var files = event.dataTransfer ? Array.prototype.slice.call(event.dataTransfer.files) : [];
    if (!files.length) {
      return;
    }
    event.preventDefault();
    window.__dropped.push.apply(window.__dropped, files.map(function (file) {
      return { name: file.name, type: file.type, size: file.size };
    }));
  });

  document.getElementById("send").addEventListener("click", function () {
    var text = composer.value;
    if (!text || !text.trim()) {
      note("nothing to send");
      return;
    }
    // A page that keeps its file input reads it again when the message leaves.
    var files = attached.splice(0, attached.length)
      .concat(window.__dropped.splice(0, window.__dropped.length));
    window.__received.push({ text: text, files: files });
    composer.value = "";
    note("messages=" + window.__received.length);
  });
})();
</script>
</body>
</html>
